services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?请设置分享网址来源}
      DATA_DIR: /data
      PORT: 8080
      TRUST_PRIVATE_GATEWAY: "1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - arena_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  gateway:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?请设置自己的域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CADDY_CONFIG:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  arena_data:
  caddy_data:
  caddy_config:
